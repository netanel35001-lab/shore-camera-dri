# Shore Camera DRI - project configuration
# All geographic values are WGS84 (EPSG:4326) unless stated otherwise.

study_area:
  name: Esbjerg approaches (Graadyb channel and outer anchorage)
  # Bounding box around the port of Esbjerg and its western approach.
  lon_min: 7.95
  lon_max: 8.60
  lat_min: 55.30
  lat_max: 55.62

ais:
  raw_dir: data/raw/ais          # put the downloaded DMA daily files here (.csv or .zip)
  processed_dir: data/processed
  # Delete the multi-GB CSVs extracted from the zips once processing is done.
  delete_extracted: true
  # Only these transponder classes are kept (drops base stations, AtoN, SAR aircraft).
  mobile_types: ["Class A", "Class B"]
  # Points implying a jump faster than this (knots) are treated as GPS/AIS errors.
  max_implied_speed_kn: 50
  # A new transit starts when a vessel is silent for longer than this (minutes).
  transit_gap_min: 30
  # Plausible hull length range (m); values outside are set to missing.
  length_min_m: 2
  length_max_m: 450

metric_crs: EPSG:25832            # ETRS89 / UTM 32N, metric CRS for Denmark

camera:
  name: Semco Maritime office building, west end of the port of Esbjerg
  # Chosen because it sits at the western edge of the port, close to the water,
  # and overlooks the Graadyb approach channel from a sufficient height.
  lat: 55.480110
  lon: 8.409856
  height_asl_m: 30               # ASSUMPTION: mast on the roof, metres above sea level

terrain:
  dem_dir: data/raw/dem          # Copernicus GLO-30 DSM tiles (.tif)
  # Missing tiles (open sea) and no-data cells are treated as sea level (0 m).
  refraction_k: 0.13             # standard atmospheric refraction coefficient
  azimuth_step_deg: 0.2          # angular resolution of the horizon table
  range_step_m: 30               # sampling step along each ray (~DEM resolution)
  max_range_m: 35000             # covers the whole study area from the camera
  skip_near_m: 60                # ignore cells next to the camera (its own building)
  sea_threshold_m: 1.0           # DSM cells below this are sea surface (removes water noise)
  processed_dir: data/processed

  # Generic sensor configurations (typical components, not a specific product).
sensors:
  - name: EO_wide                # day camera, wide setting for continuous watch
    band: eo
    pixel_pitch_um: 2.9          # typical 1080p security-camera sensor
    focal_mm: 25
    width_px: 1920
  - name: EO_zoom                # same camera zoomed in on one target
    band: eo
    pixel_pitch_um: 2.9
    focal_mm: 100
    width_px: 1920
  - name: IR                     # uncooled thermal camera, ~same FOV as EO_wide
    band: ir
    pixel_pitch_um: 17
    focal_mm: 50
    width_px: 640

dri:
  # Johnson criteria: pixels across the critical dimension (vessel height).
  detect_px: 2
  recognize_px: 8
  identify_px: 12.8
  # EO cameras need daylight; sun elevation above this counts as day
  # (-6 deg = end of civil twilight). IR works day and night.
  daylight_sun_elev_deg: -6
  # Points slower than this are treated as moored/anchored and reported apart.
  moving_min_sog_kn: 1.0